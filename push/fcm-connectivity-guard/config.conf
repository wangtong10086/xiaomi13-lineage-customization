# Seconds between checks while Android is awake. This script intentionally
# does not hold a wakelock, so normal suspend semantics are preserved.
CHECK_INTERVAL_SEC=15

# Missing connection samples before the guarded GMS persistent-process restart.
HARD_RECOVERY_AFTER_SAMPLES=2

# Never restart the persistent process more frequently than this.
HARD_RECOVERY_MIN_INTERVAL_SEC=1800

# Bound individual Android service-manager calls.
COMMAND_TIMEOUT_SEC=10
